---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # Consumers pick updates up via the moving v1 tag, so wait out the
    # window in which a compromised action release is typically discovered
    # and yanked before proposing it.
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      npm-minor:
        update-types: [minor, patch]
  # requirements.txt exists purely so yamllint bumps are proposed here too;
  # the pins job keeps lint.yml's env: mirror in step.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
