---
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This repo eats its own dog food: if the reusable workflow breaks, this
  # breaks first, before any consumer repo sees it.
  lint:
    uses: ./.github/workflows/lint.yml

  # The inline fallback pins are hand-maintained while package.json is
  # Dependabot-managed; fail fast when they drift (CLAUDE.md "Version pins").
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/check-pins.sh

  # The dogfood job above always takes lint.yml's config-and-lockfile
  # branches — this repo has all of them. Run the fallback branches (the
  # ones only config-less consumers hit) against a bare fixture too.
  fallbacks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/test-fallbacks.sh

  shellcheck-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: scripts/test-shellcheck-selection.sh
