---
name: Reusable lint

on:
  workflow_call:
    inputs:
      shellcheck_ignore_paths:
        description: >-
          Extra space-separated paths for shellcheck to skip, added to the
          always-excluded node_modules. For directories holding shell-adjacent
          files shellcheck cannot parse (zsh config, templated scripts) that a
          repo-local job checks properly instead.
        type: string
        required: false
        default: ""

jobs:
  lint:
    # One job on purpose: GitHub bills per job with a 1-minute round-up, so
    # serial steps in a single job cost 1 minute where the same linters as
    # parallel jobs would cost one minute each. The timeout is a cap, not a
    # cost: consumer repos' npm ci can be slow on a cold cache.
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Fallback pins for repos without a package.json. A repo-local pin
      # (node_modules/.bin, installed by npm ci below) wins where noted, so
      # repos that track versions via Dependabot are never overridden.
      PRETTIER_VERSION: "3.9.6"
      SECRETLINT_VERSION: "13.0.4"
      YAMLLINT_VERSION: "1.38.0"
    steps:
      # Actions are pinned to commit SHAs: this layer fans out to every
      # consumer repo, and a moving tag can be re-pointed instantly by a
      # compromised maintainer account — the Dependabot cooldown only
      # protects pins that a tag move cannot touch. Dependabot keeps SHA
      # pins (and the version comments) updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # npm/npx below execute registry code; don't leave a token in
          # .git/config for it to read
          persist-credentials: false

      # yamllint, markdownlint and shellcheck cannot fully exclude
      # node_modules on their own, so they run before npm ci creates it;
      # the explicit excludes below are a second line of defense.

      - name: shellcheck
        if: ${{ !cancelled() }}
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          # The action splits this on whitespace, so appending is enough —
          # node_modules stays excluded whatever the consumer passes.
          ignore_paths: node_modules ${{ inputs.shellcheck_ignore_paths }}

      - name: yamllint
        if: ${{ !cancelled() }}
        # The consumer's config wins; without one, fall back to a relaxed
        # config instead of yamllint's strict 80-column default.
        run: |
          pipx install "yamllint==$YAMLLINT_VERSION" >/dev/null
          config=""
          for candidate in .yamllint.yml .yamllint.yaml .yamllint; do
            if [ -f "$candidate" ]; then
              config="$candidate"
              break
            fi
          done
          if [ -z "$config" ]; then
            config="$RUNNER_TEMP/yamllint.yml"
            {
              echo "extends: default"
              echo "rules:"
              echo "  line-length:"
              echo "    max: 120"
              echo "  truthy: disable"
              echo "  comments:"
              echo "    min-spaces-from-content: 1"
              echo "ignore: |"
              echo "  node_modules/"
            } > "$config"
          fi
          yamllint -c "$config" .

      - name: Choose markdownlint config
        if: ${{ !cancelled() }}
        id: mdconfig
        # Same contract as yamllint: consumer config (auto-discovered by
        # markdownlint-cli2) wins, relaxed fallback otherwise.
        run: |
          config=""
          # Two globs, matched separately: `ls a* b*` fails when either one
          # is empty. `.markdownlint*` would also match .markdownlintignore,
          # wrongly suppressing the fallback in repos that carry only the
          # ignore file.
          if ! ls .markdownlint.* >/dev/null 2>&1 &&
            ! ls .markdownlint-cli2.* >/dev/null 2>&1; then
            config="$RUNNER_TEMP/markdownlint.yml"
            {
              echo "line-length:"
              echo "  line_length: 120"
              echo "  tables: false"
              echo "  code_blocks: false"
            } > "$config"
          fi
          echo "path=$config" >> "$GITHUB_OUTPUT"
      - name: markdownlint
        if: ${{ !cancelled() }}
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          config: ${{ steps.mdconfig.outputs.path }}
          globs: |
            **/*.md
            !node_modules

      - name: actionlint
        if: ${{ !cancelled() }}
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      # setup-node's `cache: npm` requires a lockfile, hence the split on
      # package-lock.json (npm only — pnpm/yarn repos fall back to the
      # inline pins). The .node-version variant keeps local (mise) and CI
      # on the same major for repos that pin one.
      - name: Set up node (.node-version)
        if: ${{ !cancelled() && hashFiles('package-lock.json') != '' && hashFiles('.node-version') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up node (runner default)
        if: ${{ !cancelled() && hashFiles('package-lock.json') != '' && hashFiles('.node-version') == '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
      - name: npm ci
        if: ${{ !cancelled() && hashFiles('package-lock.json') != '' }}
        # Lint tooling needs no lifecycle scripts, and scripts would run
        # arbitrary registry code next to the checkout.
        run: npm ci --ignore-scripts

      # Every lint step runs under !cancelled() so the first failure does
      # not hide findings from the rest — most importantly secretlint's.
      - name: prettier
        if: ${{ !cancelled() }}
        run: |
          if [ -x node_modules/.bin/prettier ]; then
            bin="node_modules/.bin/prettier"
          else
            bin="npx --yes prettier@$PRETTIER_VERSION"
          fi
          $bin --check --no-error-on-unmatched-pattern "**/*.{md,json,yaml,yml}"

      - name: secretlint
        if: ${{ !cancelled() }}
        # The repo-local bin is only used together with the repo's own
        # config: the npx fallback installs just the recommend preset, and
        # a repo-local install only has the rules its package.json declares
        # — mixing the two fails at rule load, not at lint.
        run: |
          rc=".secretlintrc.json"
          if [ -f "$rc" ] && [ -x node_modules/.bin/secretlint ]; then
            node_modules/.bin/secretlint --secretlintrc "$rc" "**/*"
          else
            if [ ! -f "$rc" ]; then
              rc="$RUNNER_TEMP/secretlintrc.json"
              echo '{"rules":[{"id":"@secretlint/secretlint-rule-preset-recommend"}]}' > "$rc"
            fi
            npx --yes \
              --package "secretlint@$SECRETLINT_VERSION" \
              --package "@secretlint/secretlint-rule-preset-recommend@$SECRETLINT_VERSION" \
              -- secretlint --secretlintrc "$rc" "**/*"
          fi
