---
name: Move major tag

# Pushing a release tag (v1.2.3) moves the matching major tag (v1) to the
# same commit, so consumers on @v1 / ref v1 pick the release up without any
# manual retagging.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  retag:
    name: retag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Point major tag at this release
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "$major"
