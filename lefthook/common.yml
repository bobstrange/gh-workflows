# Shared pre-commit hooks, consumed from other repos via lefthook `remotes:`.
# The `common-` prefix avoids collisions: a remote config wins on a name clash.
---
pre-commit:
  parallel: true
  commands:
    common-trailing-whitespace:
      # Deliberate exception to never-stricter-than-CI (CLAUDE.md).
      run: git diff --cached --check
    common-prettier:
      glob: "*.{md,json,yaml,yml}"
      run: >-
        sh -c 'if [ -x node_modules/.bin/prettier ];
        then node_modules/.bin/prettier --check "$@";
        else npx --yes prettier@3.9.6 --check "$@"; fi' --
        {staged_files}
    common-markdownlint:
      glob: "*.md"
      # Inactive without a repo config: the tool defaults to 80 columns, CI
      # falls back to 120. .markdownlintignore alone is not a config.
      run: >-
        sh -c '{ ls .markdownlint.* >/dev/null 2>&1 ||
        ls .markdownlint-cli2.* >/dev/null 2>&1; } || exit 0;
        if [ -x node_modules/.bin/markdownlint-cli2 ];
        then node_modules/.bin/markdownlint-cli2 "$@";
        else npx --yes markdownlint-cli2@0.23.2 "$@"; fi' --
        {staged_files}
    common-shellcheck:
      # Do not widen to CI's other names (*.zsh, .bashrc): consumers drop
      # those by path via shellcheck_ignore_paths, an input no hook has.
      run: >-
        sh -c 'command -v shellcheck >/dev/null 2>&1 || exit 0;
        n=$#;
        for f do
        case "${f##*/}" in *.sh|*.bash) set -- "$@" "$f"; continue;; *.*) continue;; esac;
        [ -x "$f" ] || continue;
        head -n1 "$f" | grep -Eqs "^#! */[^ ]*/(env *)?[abk]*sh" &&
        set -- "$@" "$f";
        done;
        shift "$n";
        [ $# -gt 0 ] || exit 0;
        shellcheck "$@"' --
        {staged_files}
    common-yamllint:
      glob: "*.{yml,yaml}"
      run: >-
        sh -c 'command -v yamllint >/dev/null 2>&1 || exit 0;
        { [ -f .yamllint.yml ] || [ -f .yamllint.yaml ] || [ -f .yamllint ]; } || exit 0;
        yamllint "$@"' --
        {staged_files}
    common-secretlint:
      # No glob: secrets live in the files a filter would skip (*.pem,
      # .npmrc, extensionless keys). The npx fallback has only the recommend
      # preset, hence repo-local bin only alongside the repo's own rc.
      run: >-
        sh -c 'rc=.secretlintrc.json;
        if [ -f "$rc" ] && [ -x node_modules/.bin/secretlint ]; then
        node_modules/.bin/secretlint --secretlintrc "$rc" "$@";
        else
        if [ ! -f "$rc" ]; then rc="$(mktemp)";
        printf "%s" "{\"rules\":[{\"id\":\"@secretlint/secretlint-rule-preset-recommend\"}]}" > "$rc"; fi;
        npx --yes --prefer-offline
        --package secretlint@13.0.4
        --package @secretlint/secretlint-rule-preset-recommend@13.0.4
        -- secretlint --secretlintrc "$rc" "$@"; fi' --
        {staged_files}
