# Shared pre-commit hooks, consumed from other repos via lefthook `remotes:`.
# Command names carry a `common-` prefix so they never collide with repo-local
# commands — on a name collision the remote config overrides lefthook.yml
# (merge order: lefthook.yml -> remotes -> lefthook-local.yml).
---
pre-commit:
  parallel: true
  commands:
    common-trailing-whitespace:
      # Deliberate exception to "never stricter than CI" (CLAUDE.md): this
      # blocks whitespace errors and conflict markers in every file type,
      # while CI only catches them in prettier-covered files.
      run: git diff --cached --check
    common-prettier:
      glob: "*.{md,json,yaml,yml}"
      # A repo-local pin (package.json + npm ci) wins; the inline pin is the
      # fallback for repos without one — same rule as the CI workflow.
      run: >-
        sh -c 'if [ -x node_modules/.bin/prettier ];
        then node_modules/.bin/prettier --check "$@";
        else npx --yes prettier@3.9.6 --check "$@"; fi' --
        {staged_files}
    common-markdownlint:
      glob: "*.md"
      # Only active in repos that carry a markdownlint config: without one
      # the tool's 80-column default is stricter than the CI fallback (120),
      # and a hook must never be stricter than the CI it fronts. Two globs
      # matched separately, same as CI: .markdownlintignore alone is not
      # a config.
      run: >-
        sh -c '{ ls .markdownlint.* >/dev/null 2>&1 ||
        ls .markdownlint-cli2.* >/dev/null 2>&1; } || exit 0;
        if [ -x node_modules/.bin/markdownlint-cli2 ];
        then node_modules/.bin/markdownlint-cli2 "$@";
        else npx --yes markdownlint-cli2@0.23.2 "$@"; fi' --
        {staged_files}
    common-shellcheck:
      # No glob: an executable without an extension is still a shell script,
      # and CI's action-shellcheck finds those by shebang. Deliberately a
      # subset of what CI scans -- CI also takes *.zsh, *.ksh, .bashrc and
      # friends, which consumers exclude by path via shellcheck_ignore_paths;
      # a hook has no such input, and must never be stricter than CI.
      # Guarded: machines without shellcheck (brew/nix not applied yet) skip
      # instead of blocking the commit; CI remains the backstop.
      run: >-
        sh -c 'command -v shellcheck >/dev/null 2>&1 || exit 0;
        n=$#;
        for f do
        case "${f##*/}" in *.sh|*.bash) set -- "$@" "$f"; continue;; *.*) continue;; esac;
        [ -x "$f" ] || continue;
        head -n1 "$f" | grep -Eqs "^#! */[^ ]*/(env *)?[abk]*sh" &&
        set -- "$@" "$f";
        done;
        shift "$n";
        [ $# -gt 0 ] || exit 0;
        shellcheck "$@"' --
        {staged_files}
    common-yamllint:
      glob: "*.{yml,yaml}"
      # Guarded on the tool and on a repo config, for the same
      # never-stricter-than-CI reason as markdownlint above.
      run: >-
        sh -c 'command -v yamllint >/dev/null 2>&1 || exit 0;
        { [ -f .yamllint.yml ] || [ -f .yamllint.yaml ] || [ -f .yamllint ]; } || exit 0;
        yamllint "$@"' --
        {staged_files}
    common-secretlint:
      # No glob on purpose: secrets live exactly in the files a filter would
      # skip (*.pem, .npmrc, extensionless keys, chezmoi dot_* sources).
      # Repo-local bin only together with the repo's own rc — the npx
      # fallback installs just the recommend preset (same rule as CI).
      run: >-
        sh -c 'rc=.secretlintrc.json;
        if [ -f "$rc" ] && [ -x node_modules/.bin/secretlint ]; then
        node_modules/.bin/secretlint --secretlintrc "$rc" "$@";
        else
        if [ ! -f "$rc" ]; then rc="$(mktemp)";
        printf "%s" "{\"rules\":[{\"id\":\"@secretlint/secretlint-rule-preset-recommend\"}]}" > "$rc"; fi;
        npx --yes --prefer-offline
        --package secretlint@13.0.4
        --package @secretlint/secretlint-rule-preset-recommend@13.0.4
        -- secretlint --secretlintrc "$rc" "$@"; fi' --
        {staged_files}
